plugins {
    id 'com.android.application'
}
android {
    namespace 'dev.demo.imguioverlay'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.demo.imguioverlay'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0'
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -Wall -Wextra' }
        }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
}
